name: Check Agent Console

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automatic tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Run real Electron deletion and Project editing regression
        run: xvfb-run -a npm run test:project-edit-visual
