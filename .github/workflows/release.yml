name: Publish Linux release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - core/**
      - electron/**
      - shared/**
      - src/**
      - scripts/verify-packaged-core.mjs
      - scripts/verify-systemd-core.mjs
      - package.json
      - package-lock.json
      - release-notes.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-console-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag="v${package_version}"

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "package.json is $package_version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

          required_assets=(
            "Agent-Console-${package_version}-x86_64.AppImage"
            "Agent-Console-${package_version}-amd64.deb"
            "latest-linux.yml"
            "Agent-Console-${package_version}-SHA256SUMS.txt"
          )
          published_assets="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          existing_tag_commit="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [ -n "$existing_tag_commit" ] && [ "$existing_tag_commit" != "$GITHUB_SHA" ]; then
            echo "$tag already points to $existing_tag_commit, but main is $GITHUB_SHA. Bump package.json before publishing changed application code."
            exit 1
          fi
          needs_publish=false
          for asset in "${required_assets[@]}"; do
            if ! grep -Fxq "$asset" <<< "$published_assets"; then
              needs_publish=true
            fi
          done

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "needs_publish=$needs_publish" >> "$GITHUB_OUTPUT"

          if [ "$needs_publish" = false ]; then
            echo "$tag is already complete; nothing to republish."
          fi

      - name: Install dependencies
        if: steps.release.outputs.needs_publish == 'true'
        run: npm ci

      - name: Build and run real Electron deletion regression
        if: steps.release.outputs.needs_publish == 'true'
        run: |
          npm run build
          xvfb-run -a npm run test:project-edit-visual

      - name: Test and package AppImage and deb
        if: steps.release.outputs.needs_publish == 'true'
        run: |
          npm test
          npm run typecheck
          npm run package:linux

      - name: Install deb and locate the system executable
        if: steps.release.outputs.needs_publish == 'true'
        id: installed_deb
        shell: bash
        run: |
          deb_path="release/Agent-Console-${{ steps.release.outputs.version }}-amd64.deb"
          package_name="$(dpkg-deb --field "$deb_path" Package)"
          sudo apt-get install -y tmux "./$deb_path"
          installed_executable="$(dpkg-query -L "$package_name" | grep '/agent-console$' | head -n 1)"
          test -n "$installed_executable"
          test -x "$installed_executable"
          echo "executable=$installed_executable" >> "$GITHUB_OUTPUT"

      - name: Verify installed packages, persistent Core, and network boundary
        if: steps.release.outputs.needs_publish == 'true'
        run: xvfb-run -a npm run test:packaged-core -- release "${{ steps.installed_deb.outputs.executable }}"

      - name: Start a real user systemd manager
        if: steps.release.outputs.needs_publish == 'true'
        shell: bash
        run: |
          user_id="$(id -u)"
          runtime_dir="/run/user/${user_id}"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user-runtime-dir@${user_id}.service"
          sudo systemctl start "user@${user_id}.service"
          test -S "${runtime_dir}/bus"
          echo "XDG_RUNTIME_DIR=${runtime_dir}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${runtime_dir}/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${runtime_dir}/bus"
          systemctl --user unset-environment DISPLAY WAYLAND_DISPLAY
          systemctl --user show-environment >/dev/null

      - name: Verify real systemd user start, restart, and tmux continuity
        if: steps.release.outputs.needs_publish == 'true'
        run: node scripts/verify-systemd-core.mjs "${{ steps.installed_deb.outputs.executable }}"

      - name: Create or repair the GitHub release
        if: steps.release.outputs.needs_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cd release
          checksum_file="Agent-Console-${RELEASE_VERSION}-SHA256SUMS.txt"
          sha256sum \
            "Agent-Console-${RELEASE_VERSION}-x86_64.AppImage" \
            "Agent-Console-${RELEASE_VERSION}-amd64.deb" \
            latest-linux.yml > "$checksum_file"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Agent Console ${RELEASE_TAG}" \
              --notes-file ../release-notes.md \
              --draft=false \
              --prerelease=false
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Agent Console ${RELEASE_TAG}" \
              --notes-file ../release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            "Agent-Console-${RELEASE_VERSION}-x86_64.AppImage" \
            "Agent-Console-${RELEASE_VERSION}-amd64.deb" \
            latest-linux.yml \
            "$checksum_file" \
            --clobber

          published_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in \
            "Agent-Console-${RELEASE_VERSION}-x86_64.AppImage" \
            "Agent-Console-${RELEASE_VERSION}-amd64.deb" \
            latest-linux.yml \
            "$checksum_file"; do
            grep -Fxq "$asset" <<< "$published_assets"
          done
